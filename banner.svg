<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Text Editor in C++ banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3864"/>
      <stop offset="0.55" stop-color="#2e75b6"/>
      <stop offset="1" stop-color="#1a9e8f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98c00"/>
      <stop offset="1" stop-color="#f4c542"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <!-- decorative circles -->
  <circle cx="930" cy="40" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="70" cy="260" r="110" fill="#ffffff" opacity="0.06"/>

  <!-- title -->
  <text x="500" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Text Editor in C++</text>
  <rect x="380" y="100" width="240" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="500" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#e8f0fe">Built on hand-written data structures. Zero STL containers.</text>

  <!-- doubly linked list of lines -->
  <g font-family="Consolas, monospace" font-size="15" text-anchor="middle">
    <!-- nodes -->
    <rect x="210" y="170" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#ffffff" stroke-width="2"/>
    <text x="285" y="195" fill="#1f3864" font-weight="700">"Hello"</text>
    <text x="285" y="216" fill="#2e75b6" font-size="12">line 0</text>

    <rect x="425" y="170" width="150" height="60" rx="8" fill="#fff4d6" stroke="#d98c00" stroke-width="3"/>
    <text x="500" y="195" fill="#7a4a00" font-weight="700">"World"</text>
    <text x="500" y="216" fill="#d98c00" font-size="12">line 1  (cursor)</text>

    <rect x="640" y="170" width="150" height="60" rx="8" fill="#d8f3dc" stroke="#ffffff" stroke-width="2"/>
    <text x="715" y="195" fill="#1b4332" font-weight="700">""</text>
    <text x="715" y="216" fill="#2d6a4f" font-size="12">line 2</text>

    <!-- next arrows (top) -->
    <g stroke="#ffffff" stroke-width="3" fill="none">
      <line x1="360" y1="190" x2="418" y2="190"/>
      <line x1="575" y1="190" x2="633" y2="190"/>
    </g>
    <polygon points="425,190 414,184 414,196" fill="#ffffff"/>
    <polygon points="640,190 629,184 629,196" fill="#ffffff"/>

    <!-- prev arrows (bottom) -->
    <g stroke="#f4c542" stroke-width="3" fill="none">
      <line x1="418" y1="212" x2="365" y2="212"/>
      <line x1="633" y1="212" x2="580" y2="212"/>
    </g>
    <polygon points="360,212 371,206 371,218" fill="#f4c542"/>
    <polygon points="575,212 586,206 586,218" fill="#f4c542"/>
  </g>

  <!-- labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="285" y="160" fill="#ffffff">head</text>
    <text x="715" y="160" fill="#ffffff">tail</text>
  </g>

  <!-- tags -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40" y="248" width="150" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="115" y="265" fill="#ffffff">KMP search</text>
    <rect x="205" y="248" width="170" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="290" y="265" fill="#ffffff">Undo / Redo stacks</text>
    <rect x="390" y="248" width="170" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="475" y="265" fill="#ffffff">Binary search</text>
    <rect x="575" y="248" width="170" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="660" y="265" fill="#ffffff">Doubly linked list</text>
    <rect x="760" y="248" width="200" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
    <text x="860" y="265" fill="#ffffff">CS-218 · NED University</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
